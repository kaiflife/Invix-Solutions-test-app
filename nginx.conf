events {
    worker_connections 1024;
}

http {
    # Встроенный DNS-сервер Docker
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;
        server_name localhost;

        # 1. Балансировка API (FastAPI)
        location /api/ {
            # Использование переменной заставляет Nginx перезапрашивать IP при каждом запросе
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /minio/ {
            proxy_pass http://minio:9000/;
            # Важно: передаем Host, который ожидает MinIO для проверки подписи
            # ngrok передает свой хост, но в подписи у нас будет ngrok-адрес
            proxy_set_header Host $http_host; 
        }

        # 2. Балансировка Фронтенда (Next.js)
        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Поддержка WebSocket для Next.js
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}